<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111d" />
    <title>SpringAndAutumnGIS · 2D / 3D Engine</title>
    <!-- 显式加载，避免依赖 JS 运行时注入 Demo 样式。 -->
    <link rel="stylesheet" href="/src/demo/demo.css" />
  </head>
  <body>
    <div id="app"></div>
    <header class="demo-header">
      <div>
        <span class="demo-eyebrow">SPRING AND AUTUMN GIS</span>
        <h1>统一 GIS Core · 双视图渲染</h1>
      </div>
      <div class="demo-mode-switch" role="group" aria-label="视图模式">
        <button id="view-2d" type="button">2D 平面</button>
        <button id="view-3d" class="is-active" type="button">3D 地球</button>
      </div>
    </header>
    <aside class="demo-panel">
      <h2>坐标链路</h2>
      <dl>
        <dt>WGS84</dt>
        <dd id="coord-wgs84">105.7184, 28.0564</dd>
        <dt>ECEF</dt>
        <dd id="coord-ecef">—</dd>
        <dt>Mercator</dt>
        <dd id="coord-mercator">—</dd>
        <dt>Tile z12</dt>
        <dd id="coord-tile">—</dd>
      </dl>
      <p id="view-description">GlobeView3D · WGS84 / ECEF / 地形表面</p>
    </aside>
    <div class="hud">SpringAndAutumnGIS demo</div>
    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
