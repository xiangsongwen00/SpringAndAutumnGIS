<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07131d" />
    <title>SpringAndAutumnGIS · 3D 经纬网 LOD</title>
    <link rel="stylesheet" href="/src/demo/demo.css" />
  </head>
  <body>
    <main id="globe" aria-label="三维地球"></main>
    <header class="brand">
      <div class="brand__eyebrow">SPRING &amp; AUTUMN GIS / CORE 01</div>
      <h1>3D 经纬网 LOD</h1>
      <p>WGS84 椭球 · Web Mercator 四叉树 · 屏幕空间误差</p>
    </header>
    <nav class="map-switcher" aria-label="地图底图切换">
      <button id="map-toggle" type="button" aria-pressed="false">切换到矢量地图</button>
    </nav>
    <aside class="stats" aria-live="polite">
      <div class="stats__label">实时四叉树状态</div>
      <div class="stats__grid">
        <div class="stats__item"><span>可见瓦片</span><strong id="selected-value">0</strong></div>
        <div class="stats__item"><span>遍历节点</span><strong id="visited-value">0</strong></div>
        <div class="stats__item"><span>裁剪节点</span><strong id="culled-value">0</strong></div>
      </div>
      <div id="levels-value">—</div>
      <div id="imagery-value">纹理等待中</div>
    </aside>
    <div class="hint">拖动旋转 · 滚轮缩放</div>
    <a id="map-attribution" class="attribution" href="https://maps.google.com/" target="_blank" rel="noreferrer">Google Maps · Satellite</a>
    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
